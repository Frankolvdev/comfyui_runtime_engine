[runtime]
mode = "embedded-simulation"
comfyui_path = "C:/Users/frank/OneDrive/Documentos/comfyui-frankestein"
host = "127.0.0.1"
port = 8188
startup_timeout_seconds = 120
strict_version = true
supported_versions = ["0.15"]

[normal]
extra_args = ["--disable-auto-launch"]

[embedded]
allow_simulation_only = false
extra_args = ["--cpu", "--disable-api-nodes"]
shutdown_grace_seconds = 2.0
ensure_workspace = true

[snapshot]
enabled = true
gpu_enabled = false
resident_models = [
  "diffusion_models/realDream_klein9BV1.safetensors",
]

[residency]
model_roots = [
  "C:/pinokio/api/comfy_3.git/app/models",
]
strict = true
execution_reserve_gb = 8.0
warmup_workflow = "warmup-workflow-api.json"
warmup_timeout_seconds = 600

warmup_inputs = [
  { source = "F:/PROYECTOS PERSONALES/TRYON/comfyui_runtime_engine/body.jpg", target = "30d09464-0d1d-4baf-8d84-4f2fb3fd0cbb.png" },
  { source = "F:/PROYECTOS PERSONALES/TRYON/comfyui_runtime_engine/face.png", target = "12f661a3367722ae211a2b282532e310.jpg" },
]

sam3_source_model = "C:/pinokio/api/comfy_3.git/app/models/sam3/sam3.pt"
sam3_expected_model = "models/sam3/sam3.pt"
sam3_link_mode = "auto"
sam3_replace_existing = false

[snapshot_lifecycle]
provider = "local-simulation"
state_path = ".runtime/snapshot-state.json"
audit_path = ".runtime/snapshot-audit.json"

[diagnostics]
json_events = true
event_log = ".runtime/events.jsonl"
