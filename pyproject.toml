[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-runtime-engine"
version = "0.14.1"
description = "Switchable runtime layer for standard and embedded ComfyUI execution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Frankolvdev"}]
dependencies = ["tomli>=2.0.1; python_version < \"3.11\""]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
comfy-runtime = "comfyui_runtime_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
